<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Auri presentation checks</title>
  <style>
    body { margin: 20px; font: 14px/1.5 system-ui, sans-serif; color: #332E2C; background: #FFFDFC; }
    button { margin: 0 8px 12px 0; padding: 8px 12px; }
    pre { white-space: pre-wrap; }
    #stage { overflow: hidden; margin-top: 16px; border: 1px solid #7D866B; }
    iframe { display: block; border: 0; transform-origin: top left; }
  </style>
</head>
<body>
  <h1>Presentation checks</h1>
  <p>This separate test page renders the unchanged deck in actual browser viewports.</p>
  <button id="fullscreen-test" type="button" disabled>Test deck’s Present button</button>
  <button id="landscape" type="button" disabled>Tablet landscape</button>
  <button id="portrait" type="button" disabled>Tablet portrait</button>
  <button id="video-suite" type="button" disabled>Run video checks</button>
  <button id="video-play" type="button" disabled>Play demo</button>
  <button id="video-pause" type="button" disabled>Pause demo</button>
  <button id="video-seek" type="button" disabled>Seek demo to 10s</button>
  <button id="video-next" type="button" disabled>Test leaving video</button>
  <pre id="video-results" aria-live="polite">Video: waiting for metadata.</pre>
  <pre id="results" aria-live="polite">Loading deck and fonts…</pre>
  <pre id="fullscreen-results" aria-live="polite">Full screen: not tested. Click the test button, then press Escape.</pre>
  <div id="stage"><iframe id="deck" title="Auri deck under test" allow="fullscreen" allowfullscreen src="../?v=video-fallback-v1#slide-4"></iframe></div>
  <script>
    const frame = document.getElementById('deck');
    const stage = document.getElementById('stage');
    const results = document.getElementById('results');
    const fullscreenResults = document.getElementById('fullscreen-results');
    const fullscreenTest = document.getElementById('fullscreen-test');
    const landscape = document.getElementById('landscape');
    const portrait = document.getElementById('portrait');
    const pause = ms => new Promise(resolve => setTimeout(resolve, ms));

    function viewport(width, height) {
      frame.style.width = width + 'px';
      frame.style.height = height + 'px';
      const scale = Math.min(1, (window.innerWidth - 44) / width, 600 / height);
      frame.style.transform = 'scale(' + scale + ')';
      stage.style.width = width * scale + 'px';
      stage.style.height = height * scale + 'px';
    }

    frame.addEventListener('load', async () => {
      const win = frame.contentWindow;
      const doc = frame.contentDocument;
      let enteredFullscreen = false;
      function recordFullscreen() {
        const child = doc.fullscreenElement || doc.webkitFullscreenElement;
        const parent = document.fullscreenElement || document.webkitFullscreenElement;
        if (child) {
          enteredFullscreen = true;
          fullscreenResults.textContent = 'ENTER verified: child fullscreenElement=' + child.tagName
            + ', parent fullscreenElement=' + (parent?.tagName || 'none')
            + ', deck Present hidden=' + doc.getElementById('present-control').hidden;
        } else if (enteredFullscreen) {
          fullscreenResults.textContent += '\nEXIT verified: child fullscreenElement=none'
            + ', deck Present hidden=' + doc.getElementById('present-control').hidden;
        }
      }
      for (const event of ['fullscreenchange', 'webkitfullscreenchange']) {
        document.addEventListener(event, recordFullscreen);
        doc.addEventListener(event, recordFullscreen);
      }
      try {
        await doc.fonts.ready;
        const report = [];
        for (const [width, height] of [[1920,1080],[1366,768],[3440,1440],[1024,768],[768,1024]]) {
          viewport(width, height);
          await pause(180);
          const box = doc.querySelector('.slide-frame').getBoundingClientRect();
          const actualViewport = win.innerWidth === width && win.innerHeight === height;
          const aspect = Math.abs(box.width / box.height - 16 / 9) < .001;
          const fits = box.left >= -1 && box.top >= -1
            && box.right <= width + 1 && box.bottom <= height + 1;
          const centered = Math.abs(box.left + box.width / 2 - width / 2) < 1
            && Math.abs(box.top + box.height / 2 - height / 2) < 1;
          const pass = actualViewport && aspect && fits && centered;
          const video = doc.querySelector('.works-video');
          if (video) {
            const player = video.getBoundingClientRect();
            const videoFits = player.left >= box.left - 1 && player.right <= box.right + 1
              && player.top >= box.top - 1 && player.bottom <= box.bottom + 1;
            const videoCentered = Math.abs(player.left + player.width / 2 - width / 2) < 1;
            const videoAspect = Math.abs(player.width / player.height - 16 / 9) < .001;
            report.push((videoFits && videoCentered && videoAspect ? 'PASS' : 'FAIL')
              + ' video ' + width + 'x' + height + ': fits=' + videoFits
              + ', centered=' + videoCentered + ', 16:9=' + videoAspect);
          }
          report.push((pass ? 'PASS' : 'FAIL') + ' ' + width + 'x' + height
            + ': actual viewport=' + win.innerWidth + 'x' + win.innerHeight
            + ', slide=' + box.width.toFixed(1) + 'x' + box.height.toFixed(1)
            + ', centered=' + centered + ', fits=' + fits + ', 16:9=' + aspect);
        }
        results.textContent = report.join('\n');
        viewport(1024,768);
        fullscreenTest.disabled = false;
        landscape.disabled = false;
        portrait.disabled = false;
      } catch (error) {
        results.textContent = 'FAIL: ' + error.message;
      }
      const video = doc.querySelector('.works-video');
      const videoResults = document.getElementById('video-results');
      if (video) {
        const source = video.querySelector('source');
        videoResults.textContent = 'SOURCE: ' + source.src + '\nBASE: ' + doc.baseURI
          + '\nH264 support: ' + video.canPlayType('video/mp4; codecs="avc1.4D4029, mp4a.40.2"');
        source.addEventListener('error', () => {
          videoResults.textContent += '\nSOURCE ERROR: ' + source.src + ', networkState=' + video.networkState;
        });
        fetch(source.src, { headers: { Range: 'bytes=0-1023' } }).then(response => {
          videoResults.textContent += '\nHTTP: ' + response.status + ' ' + response.headers.get('content-type');
        }).catch(error => { videoResults.textContent += '\nFETCH ERROR: ' + error.message; });
        const logVideo = label => {
          videoResults.textContent += '\n' + label
            + ': time=' + video.currentTime.toFixed(2)
            + ', paused=' + video.paused
            + ', soundEnabled=' + (!video.muted && video.volume > 0)
            + ', error=' + (video.error?.code || 'none');
        };
        const metadata = () => {
          videoResults.textContent = 'METADATA: source=' + video.currentSrc + ', size=' + video.videoWidth + 'x' + video.videoHeight
            + ', duration=' + video.duration.toFixed(2)
            + ', controls=' + video.controls + ', playsInline=' + video.playsInline;
          logVideo('READY');
        };
        if (video.readyState >= 1) metadata();
        else video.addEventListener('loadedmetadata', metadata, { once: true });
        video.addEventListener('error', () => logVideo('MEDIA ERROR'));
        video.addEventListener('seeked', () => logVideo('SEEK verified'));

        const suite = document.getElementById('video-suite');
        suite.disabled = false;
        suite.addEventListener('click', async () => {
          const waitFor = (promise, ms) => Promise.race([
            promise,
            new Promise((_, reject) => setTimeout(() => reject(new Error('Timed out waiting for media')), ms))
          ]);
          try {
            const before = video.currentTime;
            const playing = video.play();
            doc.getElementById('present-control').click();
            await waitFor(playing, 6000);
            await pause(1000);
            if (video.paused || video.currentTime <= before) throw new Error('Playback did not advance');
            logVideo('PASS PLAY in presentation full screen=' + Boolean(doc.fullscreenElement || doc.webkitFullscreenElement));
            video.pause();
            logVideo('PASS PAUSE');
            const sought = new Promise(resolve => video.addEventListener('seeked', resolve, { once: true }));
            video.currentTime = 10;
            await waitFor(sought, 4000);
            if (Math.abs(video.currentTime - 10) > .25) throw new Error('Seek did not reach 10 seconds');
            logVideo('PASS SEEK to 10s');
            await waitFor(video.play(), 4000);
            await pause(800);
            if (video.paused || video.currentTime <= 10) throw new Error('Playback after seek failed');
            logVideo('PASS RESUME');
            const exit = doc.exitFullscreen || doc.webkitExitFullscreen;
            if ((doc.fullscreenElement || doc.webkitFullscreenElement) && exit) await exit.call(doc);
            video.dispatchEvent(new win.KeyboardEvent('keydown', { key: 'PageDown', bubbles: true, cancelable: true }));
            await pause(150);
            if (win.location.hash !== '#slide-5' || !video.paused) throw new Error('Leaving slide failed to pause video');
            logVideo('PASS LEAVE ' + win.location.hash);
            win.location.hash = '#slide-4';
            await pause(150);
            logVideo('PASS RETURN with playback position preserved');
          } catch (error) {
            video.pause();
            videoResults.textContent += '\nSUITE FAILED: ' + error.message + ', readyState=' + video.readyState
              + ', networkState=' + video.networkState + ', src=' + (video.currentSrc || source.src);
            const exit = doc.exitFullscreen || doc.webkitExitFullscreen;
            if ((doc.fullscreenElement || doc.webkitFullscreenElement) && exit) await exit.call(doc);
          }
        });

        const play = document.getElementById('video-play');
        const pauseVideo = document.getElementById('video-pause');
        const seek = document.getElementById('video-seek');
        const next = document.getElementById('video-next');
        for (const button of [play, pauseVideo, seek, next]) button.disabled = false;
        play.addEventListener('click', async () => {
          try {
            await video.play();
            setTimeout(() => logVideo('PLAYBACK verified'), 1200);
          } catch (error) { videoResults.textContent += '\nPLAY FAILED: ' + error.message; }
        });
        pauseVideo.addEventListener('click', () => { video.pause(); logVideo('PAUSE verified'); });
        seek.addEventListener('click', () => { video.currentTime = 10; });
        next.addEventListener('click', () => {
          video.dispatchEvent(new win.KeyboardEvent('keydown', { key: 'PageDown', bubbles: true, cancelable: true }));
          setTimeout(() => logVideo('LEAVE ' + win.location.hash), 200);
        });
      }

      fullscreenTest.addEventListener('click', () => {
        const button = doc.getElementById('present-control');
        if (button.hidden) {
          fullscreenResults.textContent = 'Full screen unavailable: deck Present button is hidden in this browser.';
          return;
        }
        const hashBefore = win.location.hash;
        button.click();
        setTimeout(() => {
          const child = doc.fullscreenElement || doc.webkitFullscreenElement;
          fullscreenResults.textContent += '\nSlide unchanged by Present=' + (hashBefore === win.location.hash);
          if (!child) fullscreenResults.textContent += '\nNo full screen entered: ' + button.title;
        }, 500);
      });
      landscape.addEventListener('click', () => viewport(1024,768));
      portrait.addEventListener('click', () => viewport(768,1024));
    }, { once: true });
  </script>
</body>
</html>
