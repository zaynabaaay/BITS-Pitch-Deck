<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Auri — Pitch Day 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Comfortaa:wght@600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --white: #FFFDFC;
      --brown: #332E2C;
      --sage: #7D866B;
      --clay: #8D624E;
    }

    * { box-sizing: border-box; }

    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }

    body {
      display: grid;
      place-items: center;
      background: var(--white);
      color: var(--brown);
      font-family: "Inter", sans-serif;
    }

    .slide-frame {
      position: relative;
      width: calc(1920px * var(--slide-scale, 1));
      height: calc(1080px * var(--slide-scale, 1));
    }

    .slide {
      position: absolute;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: var(--white);
      transform: scale(var(--slide-scale, 1));
      transform-origin: top left;
    }

    .slide-header {
      position: absolute;
      top: 48px;
      left: 88px;
      width: 880px;
      display: flex;
      align-items: center;
      gap: 48px;
      font-size: 18px;
      font-weight: 500;
      line-height: 24px;
      letter-spacing: 4px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .header-rule {
      flex: 1;
      height: 1px;
      background: var(--sage);
    }

    .wordmark {
      position: absolute;
      top: 236px;
      left: 70px;
      margin: 0;
      font-family: "Comfortaa", sans-serif;
      font-size: 330px;
      font-weight: 600;
      line-height: 1.15;
      letter-spacing: -24px;
    }

    .tagline {
      position: absolute;
      top: 650px;
      left: 88px;
      margin: 0;
      font-family: "Bebas Neue", sans-serif;
      font-size: 82px;
      font-weight: 400;
      line-height: 1.02;
      letter-spacing: 1px;
    }

    .founder {
      position: absolute;
      bottom: 72px;
      left: 88px;
      margin: 0;
      padding-top: 25px;
      font-size: 24px;
      line-height: 1.6;
    }

    .founder::before {
      position: absolute;
      top: 0;
      left: 0;
      width: 100px;
      border-top: 3px solid var(--clay);
      content: "";
    }

    .founder span { display: block; color: var(--sage); font-size: 19px; }

    .cover-photo {
      position: absolute;
      top: 48px;
      right: 48px;
      width: 816px;
      height: 984px;
      margin: 0;
    }

    .cover-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  </style>
  <script>
    function resizeSlide() {
      const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
      document.documentElement.style.setProperty('--slide-scale', scale);
    }
    resizeSlide();
    window.addEventListener('resize', resizeSlide);
  </script>
</head>
<body>
  <main class="slide-frame" aria-label="Auri pitch deck">
    <section class="slide" aria-labelledby="slide-title">
      <header class="slide-header">
        <span>Auri</span>
        <span class="header-rule" aria-hidden="true"></span>
        <span>Pitch Day / 2026</span>
      </header>
      <h1 class="wordmark" id="slide-title">auri</h1>
      <p class="tagline">The personal assistant<br>that adapts to you.</p>
      <p class="founder">Zaynab Omer<span>Founder</span></p>
      <figure class="cover-photo">
        <img src="assets/workspace.jpg" alt="A naturally lit workspace with a laptop, books, and plants beside a window" width="960" height="1280">
      </figure>
    </section>
  </main>
</body>
</html>
