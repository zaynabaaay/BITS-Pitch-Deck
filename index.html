<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>auri — BITS Pitch Deck</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body { display: grid; place-items: center; background: #24201d; font-family: Arial, Helvetica, sans-serif; }
    .slide-frame { position: relative; width: calc(1920px * var(--slide-scale, 1)); height: calc(1080px * var(--slide-scale, 1)); }
    .slide { position: absolute; inset: 0 auto auto 0; width: 1920px; height: 1080px; overflow: hidden; background: #faf7f3; color: #332b27; transform: scale(var(--slide-scale, 1)); transform-origin: top left; }
    .pitch-label { position: absolute; top: 78px; left: 86px; margin: 0; font-size: 16px; line-height: 1.6; letter-spacing: 3px; font-weight: 400; }
    .pitch-label::after { content: ""; display: block; width: 88px; height: 3px; margin-top: 20px; background: #b1836b; }
    .wordmark { position: absolute; left: 78px; top: 240px; margin: 0; width: 850px; height: 370px; }
    .wordmark svg { display: block; width: 100%; height: 100%; overflow: visible; }
    .tagline { position: absolute; left: 86px; top: 640px; margin: 0; font-size: 69px; font-weight: 400; line-height: 1.15; letter-spacing: -2px; }
    .founder { position: absolute; left: 86px; bottom: 66px; margin: 0; font-size: 19px; line-height: 1.6; }
    .founder span { display: block; color: #8a8077; font-size: 16px; letter-spacing: 2px; text-transform: uppercase; }
    .photo-placeholder { position: absolute; top: 50px; right: 50px; width: 785px; height: 905px; display: grid; place-items: center; background: #e9e2d9; color: #8b7c6e; }
    .photo-placeholder span { font-size: 16px; letter-spacing: 4px; text-transform: uppercase; }
    .slide-number { position: absolute; right: 86px; bottom: 56px; margin: 0; color: #8a8077; font-size: 15px; letter-spacing: 3px; }
  </style>
  <script>
    function resizeSlide() {
      document.documentElement.style.setProperty('--slide-scale', Math.min(window.innerWidth / 1920, window.innerHeight / 1080));
    }
    resizeSlide();
    window.addEventListener('resize', resizeSlide);
  </script>
</head>
<body>
  <main class="slide-frame" aria-label="auri pitch deck for Business in the Streets">
    <section class="slide" aria-labelledby="slide-title">
      <p class="pitch-label">BITS PITCH DAY<br>2026</p>
      <h1 class="wordmark" id="slide-title" aria-label="auri">
        <svg viewBox="0 0 850 370" aria-hidden="true" focusable="false">
          <g fill="none" stroke="currentColor" stroke-width="58" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="153" cy="224" r="119" />
            <path d="M272 224 V343 M345 116 V234 A109 109 0 0 0 563 234 V116 M645 343 V223 A107 107 0 0 1 752 116 M824 131 V343" />
          </g>
          <circle cx="824" cy="39" r="30" fill="currentColor" />
        </svg>
      </h1>
      <p class="tagline">The personal assistant<br>that adapts to you.</p>
      <p class="founder">Zaynab Omer<span>Founder</span></p>
      <div class="photo-placeholder" role="img" aria-label="Placeholder for the cover photograph"><span>Photo placeholder</span></div>
      <p class="slide-number" aria-label="Slide 1">01</p>
    </section>
  </main>
</body>
</html>
