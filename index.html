<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BITS Pitch Deck</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      display: grid;
      place-items: center;
      background: #080b12;
      font-family: system-ui, sans-serif;
    }

    /* This frame takes up the slide's actual displayed size. */
    .slide-frame {
      position: relative;
      width: calc(1920px * var(--slide-scale, 1));
      height: calc(1080px * var(--slide-scale, 1));
    }

    /* All slide content is designed on a 1920 × 1080 canvas. */
    .slide {
      position: absolute;
      inset: 0 auto auto 0;
      width: 1920px;
      height: 1080px;
      padding: 120px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow: hidden;
      background: #101522;
      color: #f7f8fc;
      transform: scale(var(--slide-scale, 1));
      transform-origin: top left;
    }

    h1 {
      margin: 0;
      font-size: 120px;
      line-height: 1.1;
      letter-spacing: -0.06em;
    }

    p {
      margin: 32px 0 0;
      color: #b3bdd2;
      font-size: 36px;
      line-height: 1.5;
    }
  </style>

  <script>
    function resizeSlide() {
      const scale = Math.min(
        window.innerWidth / 1920,
        window.innerHeight / 1080
      );

      document.documentElement.style.setProperty(
        "--slide-scale",
        scale
      );
    }

    resizeSlide();
    window.addEventListener("resize", resizeSlide);
  </script>
</head>

<body>
  <main class="slide-frame" aria-label="Pitch deck">
    <section class="slide" aria-labelledby="slide-title">
      <h1 id="slide-title">BITS Pitch Deck</h1>
      <p>Pitch deck coming soon.</p>
    </section>
  </main>
</body>
</html>
